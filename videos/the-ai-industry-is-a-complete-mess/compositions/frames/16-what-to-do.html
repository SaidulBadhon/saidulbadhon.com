      headWipe($("#f16-headtxt-1"), CUE.c1 + 0.22);

      wipe($("#f16-rw-1"), $("#f16-rt-1"), CUE.r1, 0.55);
      drawMark("#f16-mk-1", CUE.x1);                       // red X on "না,"

      wipe($("#f16-rw-2"), $("#f16-rt-2"), CUE.r2, 0.55);
      drawMark("#f16-mk-2", CUE.t2);                       // red tick on "লগ"

      wipe($("#f16-rw-3"), $("#f16-rt-3"), CUE.r3, 0.55);
      drawMark("#f16-mk-3", CUE.t3);                       // red tick on "সুইচ"

      /* ---------- Scene 3 (8.9–13.4s): card 2 — a backup model from another company ---------- */
      cardIn($("#f16-card-2"), CUE.c2, 0.8);
      headWipe($("#f16-headtxt-2"), CUE.c2 + 0.22);

      tl.fromTo(
        $("#f16-tag"),
        { scale: 0, opacity: 0, rotation: 2, transformOrigin: "0% 50%" },
        { scale: 1, opacity: 1, rotation: -4, duration: 0.5, ease: "back.out(1.7)" },
        CUE.tag
      );
      wipe($("#f16-rw-4"), $("#f16-rt-4"), CUE.r4, 0.6);
      drawMark("#f16-mk-4", CUE.t4);                       // red tick
      // the spare slides out from behind the row once it is ticked
      tl.fromTo(
        $("#f16-ghost"),
        { x: -18, y: -18, opacity: 0 },
        { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        CUE.t4 + 0.3
      );

      /* ---------- Scene 4 (13.4–18.244s): card 3 — ask how fast they'd tell you; clock pops; hold ---------- */
      cardIn($("#f16-card-3"), CUE.c3, -0.8);
      headWipe($("#f16-headtxt-3"), CUE.c3 + 0.22);

      wipe($("#f16-rw-5"), $("#f16-rt-5"), CUE.r5, 0.55);
      tl.fromTo(
        $("#f16-quote"),
        { y: 36, scale: 0.9, rotation: -6, opacity: 0, transformOrigin: "50% 50%" },
        { y: 0, scale: 1, rotation: -2, opacity: 1, duration: 0.6, ease: "power3.out" },
        CUE.q
      );

      // "দ্রুত": small black clock pops beside the chip, its minute hand sweeping fast; red underline marks the word
      tl.fromTo(
        $("#f16-clock"),
        { scale: 0, opacity: 0, rotation: -20, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, rotation: 6, duration: 0.5, ease: "back.out(2)" },
        CUE.clock
      );
      tl.fromTo(
        $("#f16-hand-m"),
        { rotation: 0, svgOrigin: "50 50" },
        { rotation: 300, svgOrigin: "50 50", duration: 0.85, ease: "power2.inOut" },
        CUE.clock + 0.2
      );
      tl.fromTo(
        $("#f16-hand-h"),
        { rotation: 0, svgOrigin: "50 50" },
        { rotation: 25, svgOrigin: "50 50", duration: 0.85, ease: "power2.inOut" },
        CUE.clock + 0.2
      );
      drawStroke($("#f16-hot-ul-p"), CUE.clock + 0.12, 0.3, "power2.out");

      // pin the timeline length to the frame duration (hold, no exit)
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP_ID] = tl;
    })();
  </script>
