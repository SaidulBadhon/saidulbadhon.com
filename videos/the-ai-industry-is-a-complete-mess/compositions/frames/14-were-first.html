    <script>
      (function () {
        var ID = "14-were-first";
        var DUR = 5.853;
        var $ = function (id) {
          return document.getElementById(id);
        };

        /* ---------- deterministic geometry ---------- */
        function starPoints(n, R, r) {
          var pts = [];
          for (var i = 0; i < n * 2; i++) {
            var a = -Math.PI / 2 + (i * Math.PI) / n;
            var rad = i % 2 ? r : R;
            pts.push((Math.cos(a) * rad).toFixed(2) + "," + (Math.sin(a) * rad).toFixed(2));
          }
          return pts.join(" ");
        }
        var burstPts = starPoints(10, 214, 168);
        $("f14-burst-sh").setAttribute("points", burstPts);
        $("f14-burst-fg").setAttribute("points", burstPts);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ===== Scene 1 (0.0–1.6s): PLAY OSD, star-burst "সবার আগে!" pops on "সবার" ===== */
        // OSD visible 0.0–0.5s, then hard cut (tape resumed)
        tl.set("#f14-osd", { opacity: 0 }, 0.5);

        // "সবার" (0.82s) — HOST register spring-pop with overshoot, lands tilted
        var BURST_AT = 0.82;
        tl.fromTo(
          "#f14-burst",
          { scale: 0, rotation: -32 },
          { scale: 1, rotation: -8, duration: 0.5, ease: "back.out(1.7)" },
          BURST_AT
        );
        tl.fromTo("#f14-burst", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, BURST_AT);

        // low-amplitude finite dual-frequency jitter on the held star (inner layer composes onto the pop)
        var JIT = $("f14-burst-jit");
        var jph = { v: 0 };
        var JIT_START = BURST_AT + 0.56;
        var JIT_DUR = DUR - 0.005 - JIT_START;
        var JIT_CYCLES = 1.1 * (JIT_DUR / 2.04);
        function applyJit() {
          var rot = Math.sin(jph.v) * 0.9 + Math.sin(jph.v * 2.6) * 0.3;
          var sc = 1 + Math.sin(jph.v * 1.4) * 0.012;
          JIT.style.transform = "rotate(" + rot.toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")";
        }
        applyJit();
        tl.to(jph, { v: Math.PI * 2 * JIT_CYCLES, duration: JIT_DUR, ease: "none", onUpdate: applyJit }, JIT_START);

        /* ===== Scene 2 (1.6–2.7s): speed lines + "সবচেয়ে দ্রুত!" badge on "দ্রুত!" ===== */
        var SPEED_AT = 2.17;
        var SL_W = [980, 700, 640, 460];
        var SL_ORDER = [0, 2, 1, 3];
        SL_ORDER.forEach(function (idx, k) {
          tl.fromTo(
            "#f14-sl-" + idx,
            { x: SL_W[idx] + 80 },
            { x: 0, duration: 0.4, ease: "power3.out" },
            SPEED_AT + k * 0.04

        });
        // badge rides in on the same zip, long-tail settle, tilted +5deg
        tl.fromTo(
          "#f14-fast",
          { x: 780, rotation: 13 },
          { x: 0, rotation: 5, duration: 0.55, ease: "power3.out" },
          SPEED_AT + 0.08
        );
        tl.fromTo("#f14-fast", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, SPEED_AT + 0.08);

        /* ===== Scene 3 (2.7–4.5s): calendar flips, ticker takes over on "মডেল!" ===== */
        // "প্রতি" (2.76s) — calendar card drops in showing সেপ 22
        var CAL_AT = 2.76;
        tl.fromTo(
          "#f14-cal",
          { y: -90, scale: 0.7, rotation: -12 },
          { y: 0, scale: 1, rotation: -3, duration: 0.5, ease: "power3.out" },
          CAL_AT
        );
        tl.fromTo("#f14-cal", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, CAL_AT);

        // "সপ্তাহে" (3.16s) — sign-flip: the 22 page peels up off its top hinge, 29 is underneath
        var FLIP_AT = 3.16;
        var FLIP_DUR = 0.36;
        tl.fromTo(
          "#f14-flap",
          { rotationX: 0, transformPerspective: 900, transformOrigin: "50% 0%" },
          { rotationX: -94, transformPerspective: 900, transformOrigin: "50% 0%", duration: FLIP_DUR, ease: "power2.in" },
          FLIP_AT
        );
        tl.set("#f14-flap", { opacity: 0 }, FLIP_AT + FLIP_DUR);
        tl.fromTo(
          "#f14-num-b",
          { scale: 0.8 },
          { scale: 1, duration: 0.42, ease: "power3.out" },
          FLIP_AT + 0.2
        );
        // the whole card gets knocked by the flip, settles back
        tl.fromTo(
          "#f14-cal",
          { rotation: -3 },
          { rotation: -6.5, duration: 0.1, ease: "power2.out", immediateRender: false },
          FLIP_AT + 0.28
        );
        tl.fromTo(
          "#f14-cal",
          { rotation: -6.5 },
          { rotation: -3, duration: 0.45, ease: "power3.out", immediateRender: false },
          FLIP_AT + 0.38
        );

        // "মডেল!" (4.04s) — ticker-takeover: the black strip whips in from off-screen with an
        // X-axis motion-blur streak, scrolls fast right-to-left, and knocks the calendar as it passes under it
        var TICK_AT = 4.04;
        var TICK_DUR = 0.42;
        var TK = $("f14-tick");
        var BLUR_T = $("f14-blur-t");
        var tb = { v: 26 };
        function writeT() {
          BLUR_T.setAttribute("stdDeviation", tb.v.toFixed(2) + " 0");
          TK.style.filter = tb.v > 0.05 ? "url(#f14-streak-t)" : "none";
        }
        writeT(); // seed at peak: a seek to the entrance frame shows the streaked start
        tl.fromTo(TK, { x: 1980 }, { x: 0, duration: TICK_DUR, ease: "power3.out" }, TICK_AT);
        tl.to(tb, { v: 0, duration: TICK_DUR, ease: "power3.out", onUpdate: writeT }, TICK_AT);
        // the text scrolls linearly from the first frame of the takeover to the very end of the shot
        tl.fromTo("#f14-track", { x: 0 }, { x: -2000, duration: DUR - TICK_AT, ease: "none" }, TICK_AT);

        tl.fromTo(

        );
        tl.fromTo(

        );

        );

        tl.fromTo(SH, { x: 0, y: 0 }, { x: -9, y: 5, duration: 0.04, ease: "none" }, STOP_HIT);
