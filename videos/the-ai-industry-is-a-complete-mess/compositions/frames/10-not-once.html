        try { measured = path.getTotalLength(); } catch (e) { measured = 0; }
        var len = (measured > 0 ? measured : parseFloat(path.getAttribute("data-len"))) * 1.03;
        path.style.strokeDasharray = len + "px " + (len + 40) + "px";
        tl.fromTo(

          { strokeDashoffset: len + 20 },
          { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
          at
        );

        // digit shown at rest = strip item [rolls]; item i shows (target + i - rolls) mod 10
        for (var i = 0; i <= rolls; i++) {

          el.textContent = String(((target + i - rolls) % 10 + 10) % 10);
          strip.appendChild(el);
        }
      });

      tl.fromTo(
