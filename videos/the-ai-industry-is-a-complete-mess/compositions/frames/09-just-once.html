  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="09-just-once"]') || document;
      var q = function (s) { return scope.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(scope.querySelectorAll(s)); };

      var stripeL = q("#f09-stripe-left");
      var stripeR = q("#f09-stripe-right");
      var box = q("#f09-box");
      var eyesWrap = q("#f09-eyes");
      var eyes = qa(".f09-eye");
      var grin = q("#f09-grin");
      var tongue = q(".f09-tongue");
      var burstJit = q("#f09-burst-jit");
      var burst = q("#f09-burst");
      var onlyPill = q("#f09-only");
      var badge = q("#f09-badge");
      var bubble = q("#f09-bubble");

      var tl = gsap.timeline({ paused: true });

      // mascot glance helper (eyes follow whatever just arrived)

        tl.to(eyesWrap, { x: x, y: y, duration: d || 0.22, ease: "power3.out" }, t);
      };

        tl.to(eyes, { scaleY: 0.1, duration: 0.08, ease: "power2.in" }, t);
        tl.to(eyes, { scaleY: 1, duration: 0.12, ease: "power2.out" }, t + 0.08);
      };

      // ---- Scene 1 (0.0–2.1s): stripe-blocks settle in off their edges.
      tl.fromTo(stripeL, { x: -70, rotation: 12 }, { x: 0, rotation: 9, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(stripeR, { x: 70, rotation: -4 }, { x: 0, rotation: -8, duration: 0.6, ease: "power3.out" }, 0.05);
      // 0.05s: the AI 2026 box pops in (HOST register spring overshoot); the grin starts smug-wide.
      tl.fromTo(
        box,
        { scale: 0.35, opacity: 0, y: 70 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" },
        0.05
      );
      tl.fromTo(
        grin,
        { scaleX: 1.3, scaleY: 1.25 },
        { scaleX: 1.3, scaleY: 1.25, duration: 0.01, ease: "none" },
        0.05

      // an idle blink, then the eyes drift up-right to catch the burst.
      blink(0.95);
      // "একবার!" (1.56s): yellow "মাত্র 1 বার!" star-burst spring-pops at upper-right, tilted -8deg.
      tl.fromTo(
        burst,
        { scale: 0, opacity: 0, rotation: -42 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.55, ease: "back.out(1.8)" },
        1.56

      tl.fromTo(
        onlyPill,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" },
        1.68

      look(1.56, 12, -8);

      // finite sine jitter on the held burst — ends on a zero crossing exactly at "…তাই" (3.63s): the freeze.
      var JIT_START = 2.11;
      var JIT_END = 3.63;
      var JIT_CYCLES = 3;
      tl.fromTo(
        burstJit,
        { rotation: 0 },
        {
          rotation: 1.2,
          duration: JIT_END - JIT_START,
          ease: function (p) { return Math.sin(p * Math.PI * 2 * JIT_CYCLES); }
        },
        JIT_START

      // ---- Scene 2 (2.1–3.6s): "এক্সিডেন্ট!" (2.16s) the white badge slaps in at lower-right, rubber-stamp style.
      tl.fromTo(
        badge,
        { opacity: 0, scale: 1.9, rotation: -16, x: 50 },
        { opacity: 1, scale: 1, rotation: -5, x: 0, duration: 0.28, ease: "power3.out" },

      tl.to(burst, { scale: 1.05, duration: 0.08, ease: "power2.out" }, 2.3);
      tl.to(burst, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.38);
      look(2.2, 14, 12);
      // a nervous blink while the badge sits there.
      blink(3.1);

      // ---- Scene 3 (3.6–4.639s): "…তাই" (3.63s) the grin flattens into a short wobbly line, pupils slide sideways.
      tl.fromTo(
        grin,
        { scaleX: 1.3, scaleY: 1.25 },
        { scaleX: 0.62, scaleY: 0.15, duration: 0.3, ease: "power3.out" },
        3.63

      tl.to(tongue, { opacity: 0, duration: 0.12, ease: "power2.out" }, 3.63);
      // the flat line wobbles (finite, decaying) and settles slightly crooked.
      tl.to(grin, { rotation: 4, duration: 0.1, ease: "power2.inOut" }, 3.93);
      tl.to(grin, { rotation: -4, duration: 0.12, ease: "power2.inOut" }, 4.03);
      tl.to(grin, { rotation: 3, duration: 0.12, ease: "power2.inOut" }, 4.15);
      tl.to(grin, { rotation: -2.5, duration: 0.14, ease: "power2.inOut" }, 4.27);
      tl.to(grin, { rotation: -1, duration: 0.2, ease: "power3.out" }, 4.41);
      // eyes shrink a touch (uneasy) and slide hard to the left.
      tl.to(eyes, { scaleX: 0.9, scaleY: 0.9, duration: 0.2, ease: "power3.out" }, 3.63);
      look(3.63, -30, 2, 0.2);
      // the whole box shivers nervously for a beat.
      tl.to(box, { x: 3, duration: 0.05, ease: "power2.out" }, 3.7);
      tl.to(box, { x: -3, duration: 0.07, ease: "power2.inOut" }, 3.75);
