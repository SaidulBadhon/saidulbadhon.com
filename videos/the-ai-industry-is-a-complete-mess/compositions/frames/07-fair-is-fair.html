          var t0 = start + i * stagger;
          var len = lastEnd ? lastEnd - t0 : dur;
          tl.fromTo(strip, { y: 0 }, { y: -(10 + d) * ROW, duration: len, ease: ease }, t0);
        });
      }

      // chip pop (label-pill spring)
      function chipPop(id, at) {
        tl.fromTo(
          byId(id),
          { scale: 0, rotation: -14, opacity: 0 },
          { scale: 1, rotation: -3, opacity: 1, duration: 0.45, ease: "back.out(1.8)" },
          at
        );
      }

      var card1 = byId("f07-card1");
      var card2 = byId("f07-card2");
      var card3 = byId("f07-card3");

      // ---- Scene 1 (0.0-3.1): the three white cards fade-slide up together at 0.2s ----
      tl.fromTo(card1, { y: 70, rotation: -1, opacity: 0 }, { y: 0, rotation: -1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo(card2, { y: 70, rotation: 1, opacity: 0 }, { y: 0, rotation: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.fromTo(card3, { y: 70, rotation: -1, opacity: 0 }, { y: 0, rotation: -1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);

      // "প্রথম" (1.00): red bracket under cards 1-2
      draw("f07-bracket", 1.0, 0.6, 1200, "power2.out");
      // "সত্যি" jotted above them
      write("f07-note-true", 2.15, 0.45);

      // ---- Scene 2 (3.1-8.2): card 1 — Mythos / 10,000+ / label / tick ----
      // focus lift on card 1
      tl.fromTo(card1, { scale: 1, y: 0 }, { scale: 1.02, y: -8, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.0);
      chipPop("f07-chip1", 4.12);

      // "দশ" (5.13): "10,000+" rolls in under the icon
      tl.to(byId("f07-slot1"), { borderColor: "rgba(0,0,0,0)", duration: 0.25, ease: "power1.out" }, 5.1);
      tl.fromTo(byId("f07-wheel1"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 5.13);
      roll(strips.slice(0, 5), 5.13, 0.07, 0.95, "power3.out");
      tl.fromTo(byId("f07-plus"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 6.1);
      tl.fromTo(byId("f07-num1"), { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 6.3);

      // "সিরিয়াস" (6.31): label
      write("f07-label1", 6.31, 0.45);
      // "পেয়েছে।" (7.24): red tick on the card corner
      draw("f07-tick1", 7.24, 0.34, 210, "power2.out");

      // ---- Scene 3 (8.2-13.3): card 2 — Anthropic / $65B / label / tick ----
      // focus moves: card 1 settles + dims a touch, card 2 lifts
      tl.fromTo(card1, { scale: 1.02, y: -8 }, { scale: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 8.2);
      tl.fromTo(byId("f07-scrim1"), { opacity: 0 }, { opacity: 0.2, duration: 0.35, ease: "power1.out", immediateRender: false }, 8.2);
      tl.fromTo(card2, { scale: 1, y: 0 }, { scale: 1.02, y: -8, duration: 0.4, ease: "power3.out", immediateRender: false }, 8.25);

      // "রেভিনিউ" (9.32): chip
      chipPop("f07-chip2", 9.32);

      // "পঁয়ষট্টি" (10.65): "$65B" rolls in, landing on "ডলার।" (12.56)
      tl.to(byId("f07-slot2"), { borderColor: "rgba(0,0,0,0)", duration: 0.25, ease: "power1.out" }, 10.62);
      tl.fromTo(byId("f07-wheel2"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 10.65);
      roll(strips.slice(5, 7), 10.65, 0.1, 0, "power2.out", 12.56);
      tl.fromTo(byId("f07-bee"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 12.2);
      tl.fromTo(byId("f07-num2"), { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 12.5);

      // label + tick land on "ডলার।" (12.56)
      write("f07-label2", 12.46, 0.45);
      draw("f07-tick2", 12.56, 0.34, 210, "power2.out");

      // ---- Scene 4 (13.3-17.73): the turn to card 3 ----
      // concession over: cards 1-2 dim, card 3 lifts and its empty slot goes solid
      tl.fromTo(byId("f07-scrim1"), { opacity: 0.2 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: false }, 13.4);
      tl.fromTo(byId("f07-scrim2"), { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: false }, 13.4);
      tl.fromTo(card2, { scale: 1.02, y: -8 }, { scale: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 13.4);
      tl.fromTo(card3, { scale: 1, y: 0 }, { scale: 1.03, y: -8, duration: 0.5, ease: "power3.out", immediateRender: false }, 13.4);
      tl.to(byId("f07-slot3"), { borderColor: "rgba(0,0,0,1)", duration: 0.4, ease: "power1.out" }, 14.3);

      // "এজেন্ট?" (15.53): the red marker writes a big "?" across card 3
      draw("f07-q", 15.53, 0.62, 760, "power1.inOut");
      draw("f07-q-dot", 16.2, 0.1, 10, "power2.out");
      // marker lands: card 3 takes one finite hit
      tl.to(card3, { x: 6, duration: 0.05, ease: "power1.out" }, 16.3);
      tl.to(card3, { x: -5, duration: 0.07, ease: "power1.inOut" }, 16.35);
      tl.to(card3, { x: 0, duration: 0.12, ease: "power2.out" }, 16.42);

      // "সমস্যা।" (17.07): circle card 3, write "আসল গল্প →" above it
      draw("f07-circle", 17.07, 0.38, 2500, "power2.out");
      write("f07-note-story", 17.2, 0.38);
      draw("f07-arrow-shaft", 17.5, 0.14, 150, "power2.out");
      draw("f07-arrow-head", 17.61, 0.09, 70, "power2.out");

      // hold to the frame's fixed length
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP_ID] = tl;
    })();
  </script>
