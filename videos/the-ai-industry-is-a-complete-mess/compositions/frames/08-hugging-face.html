        <div data-layout-allow-overlap id="f08-token">
          <div id="f08-token-body">
            <i class="f08-eye f08-eye-l"></i>
            <i class="f08-eye f08-eye-r"></i>
          </div>
        </div>

        <svg data-layout-allow-overlap id="f08-marker" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <path id="f08-arrow" class="f08-ink" data-len="322" d="M 1232 486 C 1300 478, 1380 493, 1450 483 S 1516 477, 1544 480" />
          <path id="f08-arrow-head" class="f08-ink" data-len="80" d="M 1518 456 L 1548 480 L 1516 504" />
        </svg>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var COMP_ID = "08-hugging-face";
      var DURATION = 17.628;
      var scope = document.querySelector('[data-composition-id="' + COMP_ID + '"]') || document;
      function $(sel) { return scope.querySelector(sel); }
      function $$(sel) { return Array.prototype.slice.call(scope.querySelectorAll(sel)); }

      var tl = gsap.timeline({ paused: true });

      /* ---------- svg-path-draw helper: measured length, dash shifted fully off-path ---------- */
      function drawStroke(path, at, dur, ease) {
        var measured = 0;
        try { measured = path.getTotalLength(); } catch (e) { measured = 0; }
        var len = (measured > 0 ? measured : parseFloat(path.getAttribute("data-len"))) * 1.03;
        path.style.strokeDasharray = len + "px " + (len + 40) + "px";
        tl.fromTo(
          path,
          { strokeDashoffset: len + 20 },
          { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" },
          at
        );
      }

      /* ---------- number-wheel: one 0-9 reel per digit (double spin), built synchronously ---------- */
      var WHEEL_PX = 108;
      function buildWheel(host, str) {
        var reels = [];
        for (var i = 0; i < str.length; i++) {
          var ch = str.charAt(i);
          if (!/\d/.test(ch)) {
            var sep = document.createElement("span");
            sep.className = "f08-wheel-sep";
            sep.textContent = ch;
            host.appendChild(sep);
            continue;
          }
          var stops = 10 + Number(ch);
          var frame = document.createElement("span");
          frame.className = "f08-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "f08-wheel-strip";
          for (var k = 0; k <= stops; k++) {
            var step = document.createElement("span");
            step.textContent = String(k % 10);
            strip.appendChild(step);
          }
          frame.appendChild(strip);
          host.appendChild(frame);
          reels.push({ el: strip, target: -stops * WHEEL_PX });
        }
        return reels;
      }
      var reels = buildWheel($("#f08-wheel"), "17,000");

      /* ---------- macro camera: slow push-in under everything ---------- */
      tl.fromTo($("#f08-cam"), { scale: 1 }, { scale: 1.02, duration: DURATION, ease: "none" }, 0);

      /* ================= Scene 1 (0.0–2.8s): the case-file card ================= */
      tl.fromTo(
        $("#f08-card"),
        { x: -940, rotation: -5, opacity: 0 },
        { x: 0, rotation: -1, opacity: 1, duration: 0.85, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        $("#f08-tab"),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.4
      );
      // title per word on "Hugging" / "Face"
      tl.fromTo($("#f08-w1"), { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.70);
      tl.fromTo($("#f08-w2"), { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.98);
      // white stamp slams onto the card on "হামলা।"
      tl.fromTo(
        $("#f08-stamp"),
        { scale: 2.6, rotation: -16, opacity: 0 },
        { scale: 1, rotation: -6, opacity: 1, duration: 0.18, ease: "power3.in" },
        1.78
      );
      // impact shake on the card
      tl.fromTo($("#f08-card"), { y: 0 }, { y: 6, duration: 0.05, ease: "power2.out" }, 1.96);
      tl.fromTo($("#f08-card"), { y: 6 }, { y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.01);

      /* ================= Scene 2 (2.8–7.5s): row 1 + the number-wheel ================= */
      // row 1 on "চালিয়েছে"
      tl.fromTo($("#f08-line-1"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 3.25);
      tl.fromTo($("#f08-chip-1"), { scale: 0.6, opacity: 0, x: -14 }, { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.3);
      tl.fromTo($("#f08-val-1"), { yPercent: 45, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.5);

      // row 2 on "সতেরো": line + the reels roll in
      tl.fromTo($("#f08-line-2"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 5.09);
      tl.fromTo($("#f08-wheel"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 5.09);
      reels.forEach(function (r, i) {
        tl.fromTo(r.el, { y: 0 }, { y: r.target, duration: 1.1, ease: "power3.out" }, 5.09 + i * 0.07);
      });
      tl.fromTo($("#f08-plus"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" }, 6.2);
      // label on "ইভেন্ট।"
      tl.fromTo($("#f08-chip-2"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" }, 6.57);

      /* ================= Scene 3 (7.5–10.8s): the attacker row — strike + handwriting ================= */
      tl.fromTo($("#f08-line-3"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 7.54);
      tl.fromTo($("#f08-chip-3"), { scale: 0.6, opacity: 0, x: -14 }, { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.58);
      tl.fromTo($("#f08-q"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 7.7);
      // suspense wobble on the "???"
      tl.fromTo($("#f08-q"), { rotation: 0 }, { rotation: -4, duration: 0.14, ease: "power2.out" }, 8.1);
      tl.fromTo($("#f08-q"), { rotation: -4 }, { rotation: 4, duration: 0.2, ease: "power2.inOut", immediateRender: false }, 8.24);
      tl.fromTo($("#f08-q"), { rotation: 4 }, { rotation: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 8.44);
      // red marker strikes "???" on "OpenAI-এর"
      drawStroke($("#f08-sa"), 8.61, 0.2);
      drawStroke($("#f08-sb"), 8.77, 0.18);
      tl.fromTo($("#f08-q"), { opacity: 1 }, { opacity: 0.45, duration: 0.3, ease: "power1.out", immediateRender: false }, 8.72);
      // ...and writes the real attacker beside it (clip-reveal, done by "এজেন্ট।" 9.83s)
      tl.fromTo($("#f08-hand-1"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.46, ease: "power1.inOut" }, 8.98);
      tl.fromTo($("#f08-hand-2"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power1.inOut" }, 9.43);

      /* ================= Scene 4 (10.8–17.628s): the sandbox — an agent walks out ================= */
      // dashed test box on "সাইবার"
      tl.fromTo($("#f08-box"), { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 10.84);
      tl.fromTo($("#f08-test"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 11.0);
      // agent token pops inside
      tl.fromTo($("#f08-token"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, 11.3);
      // pacing inside the box (finite, deterministic)
      tl.fromTo($("#f08-token"), { x: 0 }, { x: 36, duration: 0.8, ease: "power1.inOut" }, 11.75);
      tl.fromTo($("#f08-token"), { x: 36 }, { x: -36, duration: 1.1, ease: "power1.inOut", immediateRender: false }, 12.55);
      tl.fromTo($("#f08-token"), { x: -36 }, { x: 36, duration: 1.1, ease: "power1.inOut", immediateRender: false }, 13.65);
      tl.fromTo($("#f08-token"), { x: 36 }, { x: 0, duration: 0.65, ease: "power1.inOut", immediateRender: false }, 14.75);
      // blinks
      tl.fromTo($$(".f08-eye"), { scaleY: 1 }, { scaleY: 0.12, duration: 0.07, ease: "power1.in" }, 13.25);
      tl.fromTo($$(".f08-eye"), { scaleY: 0.12 }, { scaleY: 1, duration: 0.09, ease: "power1.out", immediateRender: false }, 13.32);
      tl.fromTo($$(".f08-eye"), { scaleY: 1 }, { scaleY: 0.12, duration: 0.07, ease: "power1.in", immediateRender: false }, 14.5);
      tl.fromTo($$(".f08-eye"), { scaleY: 0.12 }, { scaleY: 1, duration: 0.09, ease: "power1.out", immediateRender: false }, 14.57);

      // safeguard chip on "সেফগার্ড" + the dial needle swings to low
      tl.fromTo($("#f08-chip"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 12.52);
      tl.fromTo(
        $("#f08-needle"),
        { rotation: 62, svgOrigin: "62 68" },
        { rotation: -72, svgOrigin: "62 68", duration: 0.6, ease: "power3.out" },
        12.8
      );
      tl.fromTo(
        $("#f08-needle"),
        { rotation: -72, svgOrigin: "62 68" },
        { rotation: -60, svgOrigin: "62 68", duration: 0.35, ease: "power2.inOut", immediateRender: false },
        13.4
      );

      // the real internet card slides in at the right edge as the token leaves
      tl.fromTo($("#f08-net"), { x: 280, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 15.25);

      // on "বেরিয়ে": token slides out through the gap; marker draws the arrow along its path
      tl.fromTo($("#f08-token"), { x: 0 }, { x: 317, duration: 0.94, ease: "power2.in", immediateRender: false }, 15.42);
      tl.fromTo($("#f08-token"), { y: 0 }, { y: -20, duration: 0.16, ease: "power2.out" }, 15.62);
      tl.fromTo($("#f08-token"), { y: -20 }, { y: 0, duration: 0.16, ease: "power2.in", immediateRender: false }, 15.78);
      tl.fromTo($("#f08-token"), { y: 0 }, { y: -20, duration: 0.14, ease: "power2.out", immediateRender: false }, 15.98);
      tl.fromTo($("#f08-token"), { y: -20 }, { y: 0, duration: 0.14, ease: "power2.in", immediateRender: false }, 16.12);
      drawStroke($("#f08-arrow"), 15.45, 0.76, "power1.inOut");
      drawStroke($("#f08-arrow-head"), 16.2, 0.18, "power2.out");

      // on "ইন্টারনেটে": impact — card nudges, token squashes against it
      tl.fromTo($("#f08-net"), { x: 0 }, { x: 18, duration: 0.07, ease: "power2.out", immediateRender: false }, 16.36);
      tl.fromTo($("#f08-net"), { x: 18 }, { x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 16.43);
      tl.fromTo($("#f08-token-body"), { scaleX: 1 }, { scaleX: 0.82, duration: 0.07, ease: "power2.out" }, 16.36);
      tl.fromTo($("#f08-token-body"), { scaleX: 0.82 }, { scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 16.43);

      // pin the timeline length to the frame duration (hold, no exit)
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[COMP_ID] = tl;
    })();
  </script>
</template>
