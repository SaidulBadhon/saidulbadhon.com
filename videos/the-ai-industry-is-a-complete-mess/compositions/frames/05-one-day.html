      <div>PAUSE</div>
      <div class="f05-osd-sp">SP</div>
    </div>

    <!-- FACT CHECK pill (static) -->
    <div class="f05-pill" id="f05-fc">ফ্যাক্ট চেক</div>

    <!-- fixed date header: sits outside the panning world -->
    <div id="f05-hdr">
      <div id="f05-hA" class="f05-pill f05-hp">29 SEP 2026</div>
      <div id="f05-hB" class="f05-pill f05-hp">OpenAI DevDay</div>
    </div>
    <div id="f05-day" data-layout-allow-overlap>একদিন</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="05-one-day"]') || document;
      function q(sel) {
        return scope.querySelector(sel) || document.querySelector(sel);
      }
      function qa(sel) {
        var list = scope.querySelectorAll(sel);
        if (!list.length) list = document.querySelectorAll(sel);
        return Array.prototype.slice.call(list);
      }

      var tl = gsap.timeline({ paused: true });

      /* ---- camera: one .world wrapper, translate(x,y) scale(S), origin = viewport centre ----
         screen = 960 + S*(P - 960) + T. Station k centre = world x 960 + 1920k.
         cam(k, S) keeps station k's centre (and the card row, y 480) pinned while S drifts. */
      var VW = 1920;
      function cam(k, S) { return { x: -S * VW * k, y: 60 * (S - 1), scale: S }; }
      function to(c, d, e) { return { x: c.x, y: c.y, scale: c.scale, duration: d, ease: e, immediateRender: false }; }
      var WIDE = { x: -864, y: -30.6, scale: 0.3 }; // all four markers in view (spacing 576px)

      var world = q("#f05-world");
      gsap.set(world, { x: WIDE.x, y: WIDE.y, scale: WIDE.scale, transformOrigin: "50% 50%" });

      /* static tilts on elements GSAP also animates (no CSS transform on them) */
      gsap.set(q("#f05-card1"), { rotation: -2 });
      gsap.set(q("#f05-plate1"), { rotation: 3 });
      gsap.set(q("#f05-card2"), { rotation: 1.5 });
      gsap.set(q("#f05-plate2"), { rotation: -2.5 });
      gsap.set(q("#f05-card3"), { rotation: -1.5 });
      gsap.set(q("#f05-plate3"), { rotation: 2.5 });
      gsap.set(q("#f05-star1"), { rotation: 12 });
      gsap.set(q("#f05-stamp"), { rotation: -8 });
      gsap.set(q("#f05-good-wrap"), { rotation: -8 });
      gsap.set(q("#f05-ten-wrap"), { rotation: -9 });
      gsap.set(q("#f05-day"), { rotation: 6 });
      gsap.set(q("#f05-b2"), { rotation: 4 });
      gsap.set(q("#f05-timer"), { rotation: -2 });
      gsap.set(q("#f05-linew"), { transformOrigin: "0% 50%" });

      /* ================= Scene 1 (0.0–3.6s) — the stage, the line, four markers ================= */
      // the timeline line draws across the wide shot
      tl.fromTo(q("#f05-linew"), { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power1.inOut" }, 0.15);

      // four station markers pop left to right
      var mks = qa(".f05-mk");
      var nums = qa(".f05-num");
      mks.forEach(function (m, i) {
        gsap.set(m, { rotation: 45 });
        tl.fromTo(m, { scale: 0 }, { scale: 1, duration: 0.4, ease: "expo.out" }, 0.55 + i * 0.25);
        tl.fromTo(nums[i], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.65 + i * 0.25);
      });

      // fixed header: date pill drops at 0.1, "OpenAI DevDay" half joins on "DevDay।"
      var hdr = q("#f05-hdr");
      tl.fromTo(q("#f05-hA"), { y: -46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(hdr, { x: 158 }, { x: 0, duration: 0.5, ease: "power3.out" }, 2.62);
      tl.fromTo(
        q("#f05-hB"),
        { clipPath: "inset(-12px 100% -12px 0px)" },
        { clipPath: "inset(-12px -12px -12px 0px)", duration: 0.45, ease: "power3.out" },
        2.62
      );
      // yellow "একদিন" chip pops beside it
      tl.fromTo(
        q("#f05-day"),
        { scale: 0, opacity: 0, transformOrigin: "0% 50%" },
        { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" },
        2.72
      );

      // camera eases from the wide timeline into station 1
      tl.fromTo(world, WIDE, to(cam(0, 1), 0.75, "power3.inOut"), 2.85);

      /* ================= Scene 2 (3.6–8.6s) — station 1: GPT-6.1 Sol ================= */
      // marker 1 lights up
      function arrive(i, t) {
        var m = mks[i];
        tl.fromTo(m, { scale: 1 }, { scale: 1.35, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(m, { scale: 1.35 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, t + 0.14);
        tl.fromTo(m, { backgroundColor: "#FFFFFF" }, { backgroundColor: "#F7CB46", duration: 0.2, ease: "none", immediateRender: false }, t);
      }
      arrive(0, 3.5);

      // "দারুণ": the white product card slides up
      tl.fromTo(q("#f05-plate1"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 4.82);
      tl.fromTo(q("#f05-card1"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 4.88);
      tl.fromTo(q("#f05-pill1"), { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.1);
      tl.fromTo(q("#f05-t1a"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.2);
      tl.fromTo(q("#f05-t1b"), { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.4);
      tl.fromTo(q("#f05-star1"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 6.3);

      // "Sol।": red marker draws a big tick on the card corner, then writes "দারুণ"
      var tick = q("#f05-tickp");
      tl.fromTo(tick, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 7.82);
      tl.fromTo(tick, { attr: { "stroke-dashoffset": 1.02 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.32, ease: "power2.out" }, 7.82);
      tl.fromTo(
        q("#f05-good"),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power1.out" },
        8.16
      );

      /* ================= Scene 3 (8.6–12.1s) — station 2: Pro $200, 20x -> 10x ================= */
      // "দুইশো": pan LEFT to station 2
      tl.fromTo(world, cam(0, 1), to(cam(0, 1.035), 8.73 - 3.6, "none"), 3.6);
      tl.fromTo(world, cam(0, 1.035), to(cam(1, 1), 0.6, "power3.inOut"), 8.73);
      arrive(1, 9.2);

      tl.fromTo(q("#f05-plate2"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 9.0);
      tl.fromTo(q("#f05-card2"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 9.06);
      tl.fromTo(q("#f05-t2"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 9.45);
      tl.fromTo(q("#f05-pill2"), { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 10.7);
      // the big "20x" slams in on "ইউসেজ"
      tl.fromTo(
        q("#f05-big"),
        { scale: 1.3, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        10.8
      );

      // "অর্ধেক।": red marker strikes through "20x" (svg-path-draw) and writes "10x"
      var s1 = q("#f05-strike1");
      var s2 = q("#f05-strike2");
      tl.fromTo(s1, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 11.26);
      tl.fromTo(s1, { attr: { "stroke-dashoffset": 1.02 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.out" }, 11.26);
      tl.fromTo(s2, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 11.46);
      tl.fromTo(s2, { attr: { "stroke-dashoffset": 1.02 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power2.out" }, 11.46);
      tl.fromTo(
        q("#f05-ten"),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.44, ease: "power1.out" },
        11.7
      );

      /* ================= Scene 4 (12.1–16.9s) — station 3: Astra, scrapped ================= */
      tl.fromTo(world, cam(1, 1), to(cam(1, 1.035), 12.23 - 9.33, "none"), 9.33);
      // "সেফটি": pan to station 3
      tl.fromTo(world, cam(1, 1.035), to(cam(2, 1), 0.6, "power3.inOut"), 12.23);
      arrive(2, 12.7);

      tl.fromTo(q("#f05-plate3"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 12.45);
      tl.fromTo(q("#f05-card3"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 12.5);
      tl.fromTo(q("#f05-pill3"), { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 12.9);

      // "বাতিল।": the white stamp slams 1.4 -> 1 across the card (impact 15.75), card jolts
      var stamp = q("#f05-stamp");
      tl.fromTo(stamp, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 15.61);
      tl.fromTo(stamp, { scale: 1.4 }, { scale: 0.97, duration: 0.14, ease: "power3.in" }, 15.61);
      tl.fromTo(stamp, { scale: 0.97 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 15.75);
      var card3 = q("#f05-card3");
      tl.fromTo(card3, { x: 0 }, { x: 7, duration: 0.05, ease: "power1.out", immediateRender: false }, 15.75);
      tl.fromTo(card3, { x: 7 }, { x: -4, duration: 0.07, ease: "power1.inOut", immediateRender: false }, 15.8);
      tl.fromTo(card3, { x: -4 }, { x: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, 15.87);

      /* ================= Scene 5 (16.9–23.427s) — station 4: the keynote stage ================= */
      tl.fromTo(world, cam(2, 1), to(cam(2, 1.035), 17.39 - 12.83, "none"), 12.83);
      // "স্টেজে": pan to station 4
      tl.fromTo(world, cam(2, 1.035), to(cam(3, 1), 0.65, "power3.inOut"), 17.39);
      arrive(3, 17.9);

      tl.fromTo(q("#f05-stage"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 17.5);
      tl.fromTo(q("#f05-live"), { scale: 0, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 18.1);
      tl.fromTo(q("#f05-agent"), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 18.3);

      // "বলল,": first speech bubble pops from the screen (origin at the tail tip)
      tl.fromTo(
        q("#f05-b1"),
        { scale: 0, opacity: 0, transformOrigin: "-40px 45%" },
        { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" },
        18.91
      );

      // "দশ": timer chip pops under the bubble and counts 0s -> 10s fast
      tl.fromTo(
        q("#f05-timer"),
        { scale: 0, opacity: 0, transformOrigin: "0% 0%" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" },
        21.2
      );
      var cnt = { v: 0 };
      var tnum = q("#f05-tnum");
      tl.fromTo(
        cnt,
        { v: 0 },
        {
          v: 10,
          duration: 0.6,
          ease: "none",
          onUpdate: function () { tnum.textContent = Math.round(cnt.v) + "s"; }
        },
        21.3
      );
      tl.fromTo(q("#f05-tfill"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "none" }, 21.3);

      // "still": the second bubble pops, smaller and tilted — then hold
      tl.fromTo(
        q("#f05-b2"),
        { scale: 0, opacity: 0, transformOrigin: "-40px 40%" },
        { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" },
        22.31
      );

      // slow settle on the punchline — the camera decelerates to a stop at the end
      tl.fromTo(world, cam(3, 1), to(cam(3, 1.03), 23.427 - 18.04, "power1.out"), 18.04);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-one-day"] = tl;
    })();
  </script>
</template>
