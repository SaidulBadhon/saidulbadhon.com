      tl.set(ink, { scale: 1.03 }, FREEZE_AT);
      tl.set(scan, { opacity: 1 }, FREEZE_AT);

      tl.fromTo(scrim, { opacity: 0 }, { opacity: 0.45, duration: 0.2, ease: "power1.out" }, FREEZE_AT);

      tl.fromTo(

      tl.set(circle, { opacity: 1 }, 0.6);
      tl.fromTo(
        circle,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },

      tl.set({}, {}, 1.4);
