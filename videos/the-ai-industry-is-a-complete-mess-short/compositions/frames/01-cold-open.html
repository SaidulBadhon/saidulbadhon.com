    (function () {

      var q = function (s) { return scope.querySelector(s); };

      // Number wheel build (number-wheel.html mechanics, "double" spin so every column rolls).
      var wheel = q("#s01-wheel");
      if (wheel && wheel.getAttribute("data-built") !== "1") {
        var value = wheel.getAttribute("data-value") || "0";
        var prefix = wheel.getAttribute("data-prefix") || "";
        var suffix = wheel.getAttribute("data-suffix") || "";
        wheel.textContent = "";
        var addSym = function (txt) {
          var s = document.createElement("span");
          s.className = "s01-wheel-sym";
          s.textContent = txt;
          wheel.appendChild(s);
        };
        if (prefix) addSym(prefix);
        for (var c = 0; c < value.length; c++) {
          var stops = 10 + Number(value.charAt(c));
          var frame = document.createElement("span");
          frame.className = "s01-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "s01-wheel-strip";
          // land on the last cell: move up stops / (stops + 1) of the strip's own height
          strip.setAttribute("data-target", String((-100 * stops) / (stops + 1)));
          for (var i = 0; i <= stops; i++) {
            var cell = document.createElement("span");
            cell.textContent = String(i % 10);
            strip.appendChild(cell);
          }
          frame.appendChild(strip);
          wheel.appendChild(frame);
        }
        if (suffix) addSym(suffix);
        wheel.setAttribute("data-built", "1");

      var stripeL = q("#s01-stripe-left");
      var stripeR = q("#s01-stripe-right");

      var banner = q("#s01-banner");

      var strips = qa(".s01-wheel-strip");

        tl.to(box, { y: -h, duration: 0.15, ease: "power2.out" }, t);
        tl.to(box, { y: 0, duration: 0.18, ease: "power2.in" }, t + 0.15);
        tl.to(box, { scaleY: 0.96, scaleX: 1.03, duration: 0.05, ease: "power2.out" }, t + 0.33);
        tl.to(box, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.38);
      };

      // ---- Scene 1 (0.0–1.4s): the set is on screen from t=0; stripe-blocks settle in off their edges.
      tl.fromTo(stripeL, { x: -70, rotation: 12 }, { x: 0, rotation: 9, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(stripeR, { x: 70, rotation: -11 }, { x: 0, rotation: -8, duration: 0.6, ease: "power3.out" }, 0.05);
      // "একদম" (0.49s): pink একদম নতুন! burst spring-pops (HOST register playful overshoot), tilted -10deg.

        allNew,
        { scale: 0, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: -10, duration: 0.5, ease: "back.out(1.8)" },
        0.49

      // ---- Scene 2 (1.4–3.7s): "AI" (1.46s) the AI 2026 box drops from above and lands heavy (squash 0.94 -> settle).
      tl.fromTo(box, { y: -1040 }, { y: 0, duration: 0.3, ease: "power2.in" }, 1.36);
      tl.to(box, { scaleY: 0.94, scaleX: 1.05, duration: 0.07, ease: "power2.out" }, 1.66);
      tl.to(box, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.73);

      look(3.85, 8, -8);
      hop(4.14, 12);
      tl.to(allNew, { rotation: -4, duration: 0.12, ease: "power2.out" }, 4.14);
      tl.to(allNew, { rotation: -10, duration: 0.3, ease: "back.out(2)" }, 4.26);
      hop(5.03, 22);
      tl.to(allNew, { rotation: -3, duration: 0.12, ease: "power2.out" }, 5.03);
      tl.to(allNew, { rotation: -10, duration: 0.3, ease: "back.out(2)" }, 5.15);
