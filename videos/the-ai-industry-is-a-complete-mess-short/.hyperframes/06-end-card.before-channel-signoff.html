  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Beat array (seconds from frame start). Silent frame — one array drives every reveal.
      const BEAT = {
        plate: 0.0, // close-frame springs in from 0.92
        shadow: 0.1, // yellow hard shadow drops out from behind it
        pill: 0.15, // white label-pill pops inside
        title: 0.5, // episode title, per word (masked rise)
        url: 0.9, // URL slams in
        star: 0.95, // pink star-burst punctures the top-right corner
        fade: 2.1, // final frame: fade to black
      };
      const END = 2.5;

      // Scene 1 — close-frame springs in from scale 0.92 (long-tail settle).
      tl.fromTo(
        "#s06-plate",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        BEAT.plate,
      );
      tl.fromTo(
        "#s06-plate",
        { scale: 0.92 },
        { scale: 1, duration: 0.55, ease: "power3.out" },
        BEAT.plate,
      );

      // 12px yellow offset shadow slides out from under the frame (12/820 of the plate = 1.463%).
      tl.fromTo(
        "#s06-shadow",
        { xPercent: 0, yPercent: 0 },
        { xPercent: 1.463, yPercent: 1.463, duration: 0.4, ease: "power3.out" },
        BEAT.shadow,
      );

      // White label-pill pops in, landing slightly crooked.
      tl.fromTo(
        "#s06-pill",
        { scale: 0.6, opacity: 0, y: 16, rotation: -6 },
        { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.4, ease: "power3.out" },
        BEAT.pill,
      );

      // Scene 2 — episode title reveals per word (bottom-up masked slide).
      gsap.utils.toArray("#s06-title .s06-w").forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 130, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          BEAT.title + i * 0.06,
        );
      });

      // The URL slams in beneath it (scale-down slam, blur resolves sharp).
      tl.fromTo(
        "#s06-url",
        { scale: 1.6, opacity: 0, filter: "blur(12px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" },
        BEAT.url,
      );

      // Pink star-burst punctures the plate's top-right corner (playful overshoot), settles tilted.
      tl.fromTo(
        "#s06-star",
        { scale: 0, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: 12, duration: 0.5, ease: "back.out(1.8)" },
        BEAT.star,
      );

      // Hold (still) — final frame fades the whole plate to black from 2.1s.
      tl.fromTo(
        "#s06-stage",
        { opacity: 1 },
        { opacity: 0, duration: END - BEAT.fade, ease: "power1.inOut" },
        BEAT.fade,
      );

      window.__timelines["06-end-card"] = tl;
    })();
