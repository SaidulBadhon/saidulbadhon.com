    (function () {
      window.__timelines = window.__timelines || {};

      var scope = document.querySelector('[data-composition-id="02-freeze"]') || document;
      function q(sel) {
        return scope.querySelector(sel) || document.querySelector(sel);
      }

      var set = q("#f02-set");
      var ink = q("#f02-ink");
      var scrim = q("#f02-scrim");
      var scan = q("#f02-scan");
      var band = q("#f02-band");
      var osd = q("#f02-osd");
      var pill = q("#f02-fc");
      var circle = q("#f02-circle");

      // The punch-in is centred on the "1/2" (banner-local point, rotated -5deg) so set + ink stay registered.
      var ORIGIN = "991px 778px";
      var FREEZE_AT = 0.12;

      // svg-path-draw setup: one dash the length of the measured path, offset fully out of view.
      var len = 0;
      try {
        len = circle.getTotalLength();
      } catch (e) {
        len = 0;
      }
      if (!(len > 0) || !isFinite(len)) len = 732; // pre-measured length of this path
      len = Math.ceil(len) + 2;
      circle.style.strokeDasharray = len + " " + len;
      circle.style.strokeDashoffset = String(len);

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.00-0.12): frame 1's final set, full colour, perfectly still.
      tl.set(set, { scale: 1, filter: "grayscale(0)", transformOrigin: ORIGIN, immediateRender: true }, 0);
      tl.set(ink, { scale: 1, transformOrigin: ORIGIN, immediateRender: true }, 0);
      tl.set(scan, { opacity: 0, immediateRender: true }, 0);
      tl.set(osd, { opacity: 0, immediateRender: true }, 0);
      tl.set(circle, { opacity: 0, immediateRender: true }, 0);

      // Scene 2 (0.12-0.45): FREEZE. Hard set: grayscale + 1.03 punch-in, scanlines and PAUSE OSD cut on.

      tl.set(ink, { scale: 1.03 }, FREEZE_AT);
      tl.set(scan, { opacity: 1 }, FREEZE_AT);
      tl.set(osd, { opacity: 1 }, FREEZE_AT);
      tl.fromTo(scrim, { opacity: 0 }, { opacity: 0.45, duration: 0.2, ease: "power1.out" }, FREEZE_AT);
