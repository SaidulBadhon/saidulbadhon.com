  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Shot beats (seconds from frame start). Silent frame — one beat array drives every reveal.
      const BEAT = {
        plate: 0.0, // close-frame springs in from 0.92
        shadow: 0.18, // yellow hard shadow drops out from behind it
        pill: 0.22, // label-pill pops inside
        title: 0.5, // post title, per word (masked rise)
        url: 1.1, // URL slams in
        star: 1.22, // pink star-burst punctures the top-right corner
        fade: 2.6, // final frame: fade to black
      };
      const END = 3.0;

      // Scene 1 — close-frame springs in (smooth long-tail settle, no overshoot).
      tl.fromTo(
        "#f19-plate",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        BEAT.plate,
      );
      tl.fromTo(
        "#f19-plate",
        { scale: 0.92 },
        { scale: 1, duration: 0.6, ease: "power3.out" },
        BEAT.plate,
      );

      // The 1.2cqw yellow offset shadow slides out from under the frame (1.2/68 of width, 1.2cqw/60cqh of height).
      tl.fromTo(
        "#f19-shadow",
        { xPercent: 0, yPercent: 0 },
        { xPercent: 1.7647, yPercent: 3.5556, duration: 0.45, ease: "power3.out" },
        BEAT.shadow,
      );

      // White label-pill pops in, landing slightly crooked.
      tl.fromTo(
        "#f19-pill",
        { scale: 0.6, opacity: 0, y: 12, rotation: -6 },
        { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.42, ease: "power3.out" },
        BEAT.pill,
      );

      // Scene 2 — post title reveals per word (bottom-up masked slide).
      gsap.utils.toArray("#f19-title .f19-w").forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 110, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          BEAT.title + i * 0.045,
        );
      });

      // The URL slams in beneath it (scale-down slam, blur resolves sharp).
      tl.fromTo(
        "#f19-url",
        { scale: 1.6, opacity: 0, filter: "blur(12px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
        BEAT.url,

      // Pink star-burst punctures the top-right corner and settles tilted.

        "#f19-star",
        { scale: 0, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: 12, duration: 0.5, ease: "expo.out" },

      tl.fromTo(
        "#f19-stage",
        { opacity: 1 },
        { opacity: 0, duration: END - BEAT.fade, ease: "power1.inOut" },
        BEAT.fade,
      );

      window.__timelines["19-end-card"] = tl;
