    (function () {

      /* ---------- svg-path-draw helper: measured length, dash shifted fully off-path ---------- */
      function drawStroke(path, at, dur) {
        var measured = 0;
        try { measured = path.getTotalLength(); } catch (e) { measured = 0; }
        var len = (measured > 0 ? measured : parseFloat(path.getAttribute("data-len"))) * 1.03;
        path.style.strokeDasharray = len + "px " + (len + 40) + "px";
        tl.fromTo(
          path,
          { strokeDashoffset: len + 20 },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          at

      }

      /* ---------- Scene 1 (0.0–2.9s): card slides up on "OpenAI", label-pill opens, chip pops on "reopened" ---------- */

        $("#f03-card"),

        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        1.28

        $("#f03-tag"),

        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.52

      /* ---------- Scene 2 (2.9–6.2s): headline builds per word — dynamic-content-sequencing ----------

      var SEC_PER_CHAR = 0.012;
      var WORD_IN = 0.42;

        { cue: 5.16, words: $$("#f03-line-2 .f03-w") }  // "HALF THE USAGE." on "half"
      ];
      var TIMELINE = [];
      CONTENT.forEach(function (entry) {
        var cumulative = entry.cue;
        entry.words.forEach(function (el) {
          var dur = BASE_WORD + (el.getAttribute("data-word") || "").length * SEC_PER_CHAR;
          TIMELINE.push({ el: el, start: cumulative, end: cumulative + dur });
          cumulative += dur;
        });
      });
      TIMELINE.forEach(function (item) {
        tl.fromTo(
          item.el,
          { yPercent: 55, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: WORD_IN, ease: "power3.out" },
          item.start

        { scale: 0, opacity: 0, rotation: -10 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" },
        13.6

      // pin the timeline length to the frame duration (hold, no exit)
