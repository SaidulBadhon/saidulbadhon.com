  <script>
    (function () {
      var ID = "09-same-as-plus";

      // ---- star-burst geometry (deterministic) ----
      function starPoints(n, R, r) {
        var pts = [];
        for (var i = 0; i < n * 2; i++) {
          var a = -Math.PI / 2 + (i * Math.PI) / n;
          var rad = i % 2 === 0 ? R : r;
          pts.push((Math.cos(a) * rad).toFixed(2) + "," + (Math.sin(a) * rad).toFixed(2));
        }
        return pts.join(" ");
      }
      var burstPts = starPoints(16, 262, 214);
      var newPts = starPoints(10, 64, 46);
      document.getElementById("f09-burst-shadow").setAttribute("points", burstPts);
      document.getElementById("f09-burst-star").setAttribute("points", burstPts);
      document.getElementById("f09-new-shadow").setAttribute("points", newPts);
      document.getElementById("f09-new-star").setAttribute("points", newPts);

      // ---- number wheel (adapted from compositions/components/number-wheel.html) ----
      // spin = double: each column adds one full 0-9 revolution before landing.
      // data-from gives the digit each column shows at rest before the roll.
      var CYCLES = 1;
      document.querySelectorAll("#f09-tag-pro .f09-nw").forEach(function (el) {
        if (el.dataset.f09Ready === "1") return;
        var value = el.dataset.value || "0";
        var from = el.dataset.from || "";
        el.textContent = "";
        for (var c = 0; c < value.length; c++) {
          var ch = value.charAt(c);
          if (!/\d/.test(ch)) {
            el.appendChild(document.createTextNode(ch));
            continue;
          }
          var stops = CYCLES * 10 + Number(ch);
          var fromCh = from.charAt(c);
          var fromIndex = /\d/.test(fromCh) ? Number(fromCh) : 0;
          var frame = document.createElement("span");
          frame.className = "f09-nw-digit";
          var strip = document.createElement("span");
          strip.className = "f09-nw-strip";
          strip.dataset.fromIndex = String(fromIndex);
          for (var s = 0; s <= stops; s++) {
            var step = document.createElement("span");
            step.textContent = String(s % 10);
            strip.appendChild(step);
          }
          frame.appendChild(strip);
          el.appendChild(frame);
        }
        el.dataset.f09Ready = "1";
      });

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0-1.45s): set is live, tape resumes; NEW PRO box slides onto the shelf =====
      // "new" 0.50s -> box slides in from the left and rocks to a stop on the plank
      tl.fromTo("#f09-boxwrap", { x: -1000 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0.44);
      tl.fromTo(
        "#f09-boxwrap",
        { rotation: 6, transformOrigin: "100% 100%" },
        { rotation: 0, duration: 0.78, ease: "back.out(1.7)" },
        0.44
      );
      // "Pro?" 0.62s -> yellow NEW! star-burst spring-pops at the box's top-left corner
      tl.fromTo(
        "#f09-new",
        { scale: 0, rotation: -40, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, rotation: -12, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
        0.62
      );

      // ===== Scene 2 (1.45-3.1s): the shelf tag flips down, unit price rolls $10 -> $20 =====
      tl.fromTo(
        "#f09-tag-pro",
        { rotationX: -92, opacity: 0, transformPerspective: 900, transformOrigin: "50% 0%" },
        { rotationX: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        1.45
      );
      // "twenty" 1.71s -> number-wheel double spin, landing on "unit!" 2.52s
      gsap.utils.toArray("#f09-tag-pro .f09-nw-strip").forEach(function (strip, i) {
        var n = strip.children.length;
        var fromIndex = Number(strip.dataset.fromIndex);
        tl.fromTo(
          strip,
          { yPercent: (-100 * fromIndex) / n },
          { yPercent: (-100 * (n - 1)) / n, duration: 0.76, ease: "power2.out" },
          1.71 + i * 0.05
        );
      });
      // "unit!" 2.52s -> price thunks into place, the plan math stamps in under it
      tl.fromTo(
        "#f09-pro-price",
        { scale: 1.14, transformOrigin: "0% 100%" },
        { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false },
        2.52
      );
      tl.fromTo(
        "#f09-pro-sub",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        2.52
      );

      // ===== Scene 3 (3.1-4.5s): SAME AS PLUS! burst pops, PLUS reference tag slides in =====
      // "same" 3.30s -> playful spring-pop (overshoot, HOST register)
      tl.fromTo(
        "#f09-burst",
        { scale: 0, rotation: -34, opacity: 0 },
        { scale: 1, rotation: -8, opacity: 1, duration: 0.55, ease: "back.out(1.7)" },
        3.3
      );
      // "Plus!" 3.65s -> small PLUS tag slides along the shelf rail from the right
      tl.fromTo(
        "#f09-tag-plus",
        { x: 700, rotation: -9, transformOrigin: "50% 0%" },
        { x: 0, rotation: 0, duration: 0.55, ease: "power3.out" },
        3.65
      );
      // infomercial jitter on the two stars (finite, low amplitude) ...
      var burstJitter = [-5.6, -10.4, -5.6, -10.4, -5.8, -9.8];
      burstJitter.forEach(function (v, i) {
        tl.to("#f09-burst", { rotation: v, duration: 0.11, ease: "sine.inOut" }, 3.88 + i * 0.11);
      });
