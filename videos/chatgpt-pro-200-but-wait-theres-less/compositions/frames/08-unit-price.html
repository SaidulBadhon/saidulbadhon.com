  <script>
    (function () {
      // ── number-wheel build (pasted from compositions/components/number-wheel.html, f08-scoped) ──
      // spin = double: one extra 0→9 revolution so every column (even a "0") visibly rolls.
      var CYCLES = 1;
      document.querySelectorAll(".f08-wheel").forEach(function (el) {
        if (el.dataset.f08WheelReady === "1") return;
        var value = el.dataset.value || "0";
        el.textContent = "";
        for (var k = 0; k < value.length; k++) {
          var ch = value.charAt(k);
          if (!/\d/.test(ch)) {
            el.appendChild(document.createTextNode(ch));
            continue;
          }
          var stops = CYCLES * 10 + Number(ch);
          var frame = document.createElement("span");
          frame.className = "f08-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "f08-wheel-strip";
          // land on its own digit: strip is (stops + 1) cells tall, move up `stops` cells
          strip.dataset.targetPct = String((-100 * stops) / (stops + 1));
          for (var i = 0; i <= stops; i++) {
            var cell = document.createElement("span");
            cell.textContent = String(i % 10);
            strip.appendChild(cell);
          }
          frame.appendChild(strip);
          el.appendChild(frame);
        }
        el.dataset.f08WheelReady = "1";
      });

      // ── svg-path-draw setup: measured lengths, dash parked fully off the path (round caps hidden) ──
      function prepDraw(id) {
        var p = document.getElementById(id);
        var len = p.getTotalLength();
        p.style.strokeDasharray = len + " " + (len + 40);
        p.style.strokeDashoffset = String(len + 20);
        return len + 20;
      }
      var circleOff = prepDraw("f08-circle");
      var under1Off = prepDraw("f08-under-1");
      var under2Off = prepDraw("f08-under-2");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 — "Now" (0.30): shelf plank slides in from the left
      tl.fromTo("#f08-plank", { x: -2100 }, { x: 0, duration: 0.95, ease: "power3.out" }, 0.3);
      // "shelf" (1.45): formula chip pops top-center (smooth settle — checker register, no overshoot)
      tl.fromTo("#f08-chip", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.45);

      // box drop: falls onto the plank, lands with a short squash and a long-tail settle (no bounce)
      function dropBox(sel, at, fromY, fall) {
        tl.fromTo(sel, { y: fromY }, { y: 0, duration: fall, ease: "power2.in" }, at);
        tl.fromTo(sel, { scaleX: 1, scaleY: 1 }, { scaleX: 1.05, scaleY: 0.93, duration: 0.06, ease: "power1.out" }, at + fall);
        tl.to(sel, { scaleX: 1, scaleY: 1, duration: 0.45, ease: "power3.out" }, at + fall + 0.06);
      }
      // tag swing: hangs from the black clip, rotate −12° → 0 on power3
      function swingTag(sel, at) {
        tl.fromTo(sel, { rotation: -12, y: -18 }, { rotation: 0, y: 0, duration: 0.8, ease: "power3.out" }, at);
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
      }
      // scanner pass: one red laser line sweeps across the tag (clipped to the tag face)
      function laser(sel, at) {
        tl.fromTo(sel, { x: -12 }, { x: 476, duration: 0.42, ease: "power1.inOut" }, at);
      }
      // unit price rolls in: row settles in, every digit column rolls to its value (number-wheel)
      function rollPrice(rowSel, at, dur) {
        tl.fromTo(rowSel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, at);
        document.querySelectorAll(rowSel + " .f08-wheel-strip").forEach(function (strip, i) {
          tl.fromTo(strip, { yPercent: 0 }, { yPercent: Number(strip.dataset.targetPct), duration: dur, ease: "power3.out" }, at + i * 0.07);
        });
      }

      // Scene 2 — PLUS
      dropBox("#f08-box-plus", 2.24, -700, 0.34);      // "Plus:" 2.30 — lands ~2.58
      swingTag("#f08-tag-plus", 2.99);                  // "twenty" 2.99
      laser("#f08-laser-plus", 5.25);                   // "twenty a unit" 5.25
