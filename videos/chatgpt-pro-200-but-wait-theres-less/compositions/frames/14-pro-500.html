            var a = -Math.PI / 2 + (i * Math.PI) / n;
            var rad = i % 2 ? r : R;

          var y = TICK_B * Math.sin(phi);
          var alpha = (Math.atan2(Math.sin(phi) / TICK_B, Math.cos(phi) / TICK_A) * 180) / Math.PI;
          $("f14-arm-" + i).style.transform =
            "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (alpha - 90).toFixed(1) + "deg)";
        });

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ===== Scene 1 (0.0–1.24s): PLAY OSD, small box sits, NOT ENOUGH? pill ===== */
        // OSD visible 0.0–0.5s, then hard cut (tape resumed)
        tl.set("#f14-osd", { opacity: 0 }, 0.5);

        // "enough?" (0.66s) — label-pill spring-pops above the small box (HOST overshoot register)
        tl.fromTo(
          "#f14-pill",
          { scale: 0, rotation: -14, opacity: 0 },
          { scale: 1, rotation: -4, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
          0.66
        );

        /* ===== Scene 2 (1.24–3.2s): speed lines, GIANT box crashes in + shoves ===== */
        // "Upgrade" (1.24s) — black speed lines streak in from the right
        var SL_W = [600, 420, 720, 500, 640, 440];
        var SL_ORDER = [2, 0, 4, 1, 5, 3];
        SL_ORDER.forEach(function (idx, k) {
          tl.fromTo(
            "#f14-sl-" + idx,
            { x: SL_W[idx] + 80 },
            { x: 0, duration: 0.42, ease: "power3.out" },
            1.24 + k * 0.04
          );
        });

        // the little box notices — eyes glance right, then mouth drops to an "O"
        tl.fromTo("#f14-s-eyes", { x: 0 }, { x: 7, duration: 0.18, ease: "power3.out" }, 1.42);
        tl.set("#f14-s-grin", { opacity: 0 }, 2.02);
        tl.set("#f14-s-oh", { opacity: 1 }, 2.02);

        // "Pro" (2.21s) — reactive-displacement: ONE driver feeds intruder + victim.
        // Intruder: off-screen right -> rest at center-left, long power3 settle (heavy land on "hundred!" ~2.72s).
        // motion-blur-streak: X-only blur rides the SAME window + ease as the intruder's position.
        // Victim: displaced only once the intruder's leading edge reaches it, flung off the left edge, tumbling -15deg.
        var INTR = $("f14-intruder");
        var VIC = $("f14-victim");
        var PSH = $("f14-pill-shove");
        var BLUR_A = $("f14-blur-a");
        var BLUR_V = $("f14-blur-v");
        var CRASH_AT = 2.21;
        var CRASH_DUR = 0.9;
        var CRASH_EASE = gsap.parseEase("power3.out");
        var INTR_START_X = 1800; // off-stage right (incl. tilt + NEW! sticker)
        var INTR_TILT = 8;
        var FADE_SHARP = 8;
        var PEAK_BLUR = 18;
        var CONTACT_GAP = 1118 - 370; // victim right edge (+shadow) minus intruder resting left edge
        var P_CONTACT = 1 - CONTACT_GAP / INTR_START_X;
        // invert the crash ease (deterministic bisection) -> driver time of first contact
        var T_CONTACT = (function () {
          var lo = 0;
          var hi = 1;
          for (var k = 0; k < 40; k++) {
            var mid = (lo + hi) / 2;
            if (CRASH_EASE(mid) < P_CONTACT) lo = mid;
            else hi = mid;
          }
          return (lo + hi) / 2;
        })();
        var VIC_SPAN = 0.34 / CRASH_DUR;
        var VIC_TRAVEL = 1300;
        var VIC_KICK = -15;
        var VIC_BLUR = 14;
        var drv = { t: 0 };

        function applyCrash() {
          var t = drv.t;
          var p = CRASH_EASE(t);

          // intruder
          var ix = INTR_START_X * (1 - p);
          var irot = -INTR_TILT * (1 - p);
          INTR.style.transform =
            "translate3d(" + ix.toFixed(2) + "px,0px,0px) rotate(" + irot.toFixed(3) + "deg)";
          INTR.style.opacity = String(Math.min(1, p * FADE_SHARP));
          INTR.style.visibility = p > 0 ? "inherit" : "hidden";
          var b = PEAK_BLUR * (1 - p);
          BLUR_A.setAttribute("stdDeviation", b.toFixed(2) + " 0");
          INTR.style.filter = p > 0 && b > 0.05 ? "url(#f14-streak-a)" : "none";

          // victim (derived from the same driver)
          var q = Math.min(1, Math.max(0, (t - T_CONTACT) / VIC_SPAN));
          var qe = 1 - Math.pow(1 - q, 1.5);
          VIC.style.transform =
            "translate3d(" +
            (-VIC_TRAVEL * qe).toFixed(2) +
            "px," +
            (-20 * qe).toFixed(2) +
            "px,0px) rotate(" +
            (VIC_KICK * qe).toFixed(3) +
            "deg)";
          VIC.style.visibility = q < 1 ? "inherit" : "hidden";
          PSH.style.transform =
            "translate3d(" +
            (-140 * qe).toFixed(2) +
            "px," +
            (-36 * qe).toFixed(2) +
            "px,0px) rotate(" +
            (-12 * qe).toFixed(3) +
            "deg)";
          var vb = q > 0 && q < 1 ? VIC_BLUR * Math.sqrt(1 - q) : 0;
          BLUR_V.setAttribute("stdDeviation", vb.toFixed(2) + " 0");
          VIC.style.filter = vb > 0.05 ? "url(#f14-streak-v)" : "none";
        }
        applyCrash(); // seed frame 0: intruder off-stage + hidden, victim at rest
        tl.to(drv, { t: 1, duration: CRASH_DUR, ease: "none", onUpdate: applyCrash }, CRASH_AT);

        // heavy landing on "hundred!" — brief squash on the box, long power3 recovery
        tl.fromTo(
          "#f14-big-squash",
          { scaleX: 1, scaleY: 1 },
          { scaleX: 1.035, scaleY: 0.955, duration: 0.09, ease: "power2.out" },
          2.7
        );
        tl.fromTo(
          "#f14-big-squash",
          { scaleX: 1.035, scaleY: 0.955 },
          { scaleX: 1, scaleY: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
          2.79
        );

        /* ===== Scene 3 (3.2–5.0s): 25x! burst, ULTRAFAST! streak, footnote pill ===== */
        // "Twenty-five-x!" (3.22s) — blue star-burst spring-pops upper-right
        tl.fromTo(
          "#f14-burst",
          { scale: 0, rotation: -25, opacity: 0 },
          { scale: 1, rotation: 8, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
          3.22
        );
        // low-amplitude, finite dual-frequency jitter on the held burst (inner layer composes onto the pop)
        var JIT = $("f14-burst-jit");
        var jph = { v: 0 };
        var JIT_START = 3.78;
        function applyJit() {
          var rot = Math.sin(jph.v) * 0.9 + Math.sin(jph.v * 2.6) * 0.3;
          var sc = 1 + Math.sin(jph.v * 1.4) * 0.012;
          JIT.style.transform = "rotate(" + rot.toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")";
        }
        applyJit();
        tl.to(
          jph,
          { v: Math.PI * 2 * 1.1, duration: DUR - 0.005 - JIT_START, ease: "none", onUpdate: applyJit },
          JIT_START
        );

        // "Ultrafast" (4.11s) — whips in under the burst with an X-axis motion-blur streak
        var UW = $("f14-ultra-wrap");
        var BLUR_U = $("f14-blur-u");
        var ub = { v: 22 };
        function writeU() {
          BLUR_U.setAttribute("stdDeviation", ub.v.toFixed(2) + " 0");
          UW.style.filter = ub.v > 0.05 ? "url(#f14-streak-u)" : "none";
        }
        writeU(); // seed at peak: a seek to the entrance frame shows the streaked start
        tl.fromTo(UW, { x: 640, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, 4.11);
        tl.to(ub, { v: 0, duration: 0.42, ease: "expo.out", onUpdate: writeU }, 4.11);
        tl.fromTo("#f14-tok", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 4.27);

        /* ===== Scene 4 (5.0–5.825s): CALL NOW pops, then presses on "now!" ===== */
        tl.fromTo(
          "#f14-cta",
          { scale: 0, rotation: -8, opacity: 0 },
          { scale: 1, rotation: 0, opacity: 1, duration: 0.22, ease: "back.out(1.5)" },
          5.07
        );
        // press-release-spring: linear-ish press, spring release (adjacent -> state continuity)
        var PRESS_AT = 5.31;
        var PRESS_DUR = 0.12;
        var RELEASE_AT = PRESS_AT + PRESS_DUR;
        tl.to(
          "#f14-cta",
          { scale: 0.9, boxShadow: "rgb(0, 0, 0) 2px 2px 0px 0px", duration: PRESS_DUR, ease: "power1.in" },
          PRESS_AT
        );
        tl.to(
          "#f14-cta",
          { scale: 1, boxShadow: "rgb(0, 0, 0) 8px 8px 0px 0px", duration: 0.38, ease: "back.out(2)" },
          RELEASE_AT
        );
        // release burst (hard-edged action ticks behind the button, in place of a blurred glow)
        for (var i = 0; i < 6; i++) {
          tl.fromTo(
            "#f14-tick-" + i,
            { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
            RELEASE_AT + (i % 3) * 0.03
          );
        }

        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
