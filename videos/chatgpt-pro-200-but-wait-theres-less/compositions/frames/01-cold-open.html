  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="01-cold-open"]') || document;
      var q = function (s) { return scope.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(scope.querySelectorAll(s)); };

      // Number wheel build (number-wheel.html mechanics, "double" spin so every column rolls).
      var wheel = q("#f01-wheel");
      if (wheel && wheel.getAttribute("data-built") !== "1") {
        var value = wheel.getAttribute("data-value") || "0";
        wheel.textContent = "";
        var sym = document.createElement("span");
        sym.className = "f01-wheel-sym";
        sym.textContent = "$";
        wheel.appendChild(sym);
        for (var c = 0; c < value.length; c++) {
          var stops = 10 + Number(value.charAt(c));
          var frame = document.createElement("span");
          frame.className = "f01-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "f01-wheel-strip";
          // land on the last cell: move up stops / (stops + 1) of the strip's own height
          strip.setAttribute("data-target", String((-100 * stops) / (stops + 1)));
          for (var i = 0; i <= stops; i++) {
            var cell = document.createElement("span");
            cell.textContent = String(i % 10);
            strip.appendChild(cell);
          }
          frame.appendChild(strip);
          wheel.appendChild(frame);
        }
        wheel.setAttribute("data-built", "1");
      }

      var stripeL = q("#f01-stripe-left");
      var stripeR = q("#f01-stripe-right");
      var allNew = q("#f01-allnew");
      var box = q("#f01-box");
      var devday = q("#f01-devday");
      var eyesWrap = q("#f01-eyes");
      var eyes = qa(".f01-eye");
      var grin = q("#f01-grin");
      var priceBurst = q("#f01-price-burst");
      var strips = qa(".f01-wheel-strip");
      var banner = q("#f01-banner");
      var half = q("#f01-half");
      var gaugeFill = q("#f01-gauge-fill");
      var fullPill = q("#f01-full-pill");
      var fullTxt = q("#f01-full-txt");
      var halfTxt = q("#f01-half-txt");

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.4s): the set is on screen from t=0; stripe-blocks settle in off their edges.
      tl.fromTo(stripeL, { x: -220, rotation: 9 }, { x: 0, rotation: 9, duration: 0.55, ease: "power3.out" }, 0);
      tl.fromTo(stripeR, { x: 220, rotation: -8 }, { x: 0, rotation: -8, duration: 0.55, ease: "power3.out" }, 0.05);
      // "all-new" (0.93s): pink ALL NEW! burst spring-pops (playful overshoot, HOST register), tilted -10deg.
      tl.fromTo(
        allNew,
        { scale: 0, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: -10, duration: 0.5, ease: "back.out(1.8)" },
        0.9
      );

      // ---- Scene 2 (1.4–2.9s): "ChatGPT" (1.44s) the PRO box drops from above and lands heavy.
      tl.fromTo(box, { y: -1020 }, { y: 0, duration: 0.3, ease: "power2.in" }, 1.32);
      tl.to(box, { scaleY: 0.94, scaleX: 1.05, duration: 0.07, ease: "power2.out" }, 1.62);
      tl.to(box, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.69);
      // "Pro!" (2.21s): AS SEEN AT DEVDAY pill pops beside the box's top-right corner.
      tl.fromTo(
        devday,
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 5, duration: 0.45, ease: "back.out(1.8)" },
        2.17
      );
      // mascot blinks once (~2.6s): eyes scaleY 1 -> 0.1 -> 1.
      tl.to(eyes, { scaleY: 0.1, duration: 0.06, ease: "power2.in" }, 2.62);
      tl.to(eyes, { scaleY: 1, duration: 0.1, ease: "power2.out" }, 2.68);

      // ---- Scene 3 (2.9–4.8s): "two-hundred-dollar" (3.57s) the blue $200 burst spring-pops at the right.
      tl.to(eyesWrap, { x: 10, duration: 0.25, ease: "power3.out" }, 3.5); // mascot glances at the price
      tl.fromTo(
        priceBurst,
        { scale: 0, opacity: 0, rotation: -30 },
        { scale: 1, opacity: 1, rotation: 6, duration: 0.55, ease: "back.out(1.6)" },
        3.5
      );
      // number-wheel roll to 200 — lands by 4.2s.
      tl.fromTo(
        strips,
        { yPercent: 0 },
        {
          yPercent: function (idx, el) { return Number(el.getAttribute("data-target")); },
          duration: 0.5,
          ease: "power3.out",
          stagger: 0.04
        },
        3.6
      );

      // ---- Scene 4 (4.8–6.452s): "HALF" (5.35s) the banner slaps in from the right, tilted -5deg.
      tl.fromTo(
        banner,
        { x: 1800, rotation: -6, skewX: -12 },
        { x: 0, rotation: -5, skewX: 0, duration: 0.34, ease: "power3.out" },
        5.28
      );
      tl.fromTo(
        half,
        { scale: 1.9, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: 4, duration: 0.3, ease: "power3.out" },
        5.55
      );
      // same beat: CONTENTS gauge drains 100% -> 50% (stat-bars-and-fills, clip-path fill) ...
      tl.fromTo(
        gaugeFill,
        { clipPath: "inset(0% 0% 0% 0%)" },
        { clipPath: "inset(50% 0% 0% 0%)", duration: 0.7, ease: "power2.inOut" },
        5.35
      );
      // ... the gauge tag cuts FULL -> HALF as it passes the line ...
      tl.set(fullTxt, { opacity: 0 }, 5.72);
      tl.fromTo(halfTxt, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.72);
      tl.set(fullPill, { backgroundColor: "#FE90E8" }, 5.72);
      // ... and the mascot's grin widens.
      tl.to(grin, { scaleX: 1.3, scaleY: 1.25, duration: 0.4, ease: "back.out(1.7)" }, 5.4);

      // hold to the end (no exit) — pin the timeline length to the frame duration.
      tl.set({}, {}, 6.452);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-cold-open"] = tl;
    })();
  </script>
