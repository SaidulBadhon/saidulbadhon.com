        star,

        { scale: 1, rotation: 8, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
        0.77,

        { xPercent: -50, yPercent: -50, scale: 1, rotation: -5, duration: 0.2, ease: "power3.in" },

        banner,

          keyframes: [
            { scaleX: 1.06, scaleY: 0.86, duration: 0.05, ease: "power2.out" },
            { scaleX: 1, scaleY: 1, duration: 0.32, ease: "power3.out" },

            { scaleY: 0.1, duration: 0.14 },
