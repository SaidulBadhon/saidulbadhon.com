  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // ── number-wheel build (pasted from compositions/components/number-wheel.html, f15-scoped) ──
      // spin = double: one extra 0→9 revolution so every column (even a "0") visibly rolls.
      document.querySelectorAll(".f15-wheel").forEach(function (el) {
        if (el.dataset.f15WheelReady === "1") return;
        var value = el.dataset.value || "0";
        el.textContent = "";
        for (var c = 0; c < value.length; c++) {
          var ch = value.charAt(c);
          if (!/\d/.test(ch)) {
            el.appendChild(document.createTextNode(ch));
            continue;
          }
          var stops = 10 + Number(ch);
          var frame = document.createElement("span");
          frame.className = "f15-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "f15-wheel-strip";
          // strip is (stops + 1) em tall; landing on its own digit = -stops em = this yPercent
          strip.dataset.targetPct = String((-100 * stops) / (stops + 1));
          for (var i = 0; i <= stops; i++) {
            var step = document.createElement("span");
            step.textContent = String(i % 10);
            strip.appendChild(step);
          }
          frame.appendChild(strip);
          el.appendChild(frame);
        }
        el.dataset.f15WheelReady = "1";
      });

      // ── svg-path-draw setup: measured length → dasharray / hidden dashoffset ──
      function prepDraw(id) {
        var p = document.getElementById(id);
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!(len > 0)) { p.setAttribute("pathLength", "100"); len = 100; }
        p.style.strokeDasharray = len + " " + (len + 40);
        p.style.strokeDashoffset = String(len + 20);
        return len + 20;
      }
      var ulineOff = prepDraw("f15-uline-path");
      var heat1Off = prepDraw("f15-heat-1");
      var heat2Off = prepDraw("f15-heat-2");
      var heat3Off = prepDraw("f15-heat-3");
      var strikeOff = prepDraw("f15-strike-path");

      var tl = gsap.timeline({ paused: true });

      function drawOn(sel, off, at, dur) {
        tl.fromTo(sel, { strokeDashoffset: off }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
      }
      function writeOn(sel, at, dur) {
        tl.fromTo(sel, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease: "none" }, at);
      }
      // checker-register pop: scale up from half, long-tail settle, no overshoot
      function pop(sel, at, fromRot, toRot) {
        tl.fromTo(sel, { scale: 0.5, rotation: fromRot, opacity: 0 }, { scale: 1, rotation: toRot, opacity: 1, duration: 0.45, ease: "power4.out" }, at);
      }

      // ── Scene 1 · the PRO $500 shelf tag ──
      // "সেটাও" 0.05 — plank stub slides in, the tag swings down off its black clip
      tl.fromTo("#f15-shelf-in", { x: -220 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0.05);
      tl.fromTo("#f15-shelf-in", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 0.05);
      tl.fromTo("#f15-tag", { rotation: -14, y: -18 }, { rotation: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.05);
      // "বিশ" 1.96 — unit price rolls in (number-wheel)
      tl.fromTo("#f15-price", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 1.96);
      document.querySelectorAll("#f15-price .f15-wheel-strip").forEach(function (strip, i) {
        tl.fromTo(strip, { yPercent: 0 }, { yPercent: Number(strip.dataset.targetPct), duration: 0.9, ease: "power3.out" }, 1.96 + i * 0.07);
      });
      // "ডলার।" 2.32 — red marker underlines the unit price
      drawOn("#f15-uline-path", ulineOff, 2.32, 0.45);
      // "স্পিড," 4.08 — "= স্পিড," writes on
      writeOn("#f15-note-1", 4.08, 0.55);
      // "ভ্যালু" 4.94 — "ভ্যালু না" completes it beneath
      writeOn("#f15-note-2", 4.94, 0.6);

      // ── Scene 2 · scale-swap the tag + notes to the upper-left corner at 40% ──
      // "তাহলে" 6.00 — outgoing: shrink + fade fast toward the corner (power2.in)
      tl.fromTo("#f15-grp-big", { scale: 1, x: 0, y: 0, opacity: 1 }, { scale: 0.6, x: -110, y: -166, opacity: 0, duration: 0.38, ease: "power2.in", immediateRender: false }, 6.0);
      // incoming: the parked 40% copy arrives with weight, overlapping the exit tail by 0.15s (z above)
      tl.fromTo("#f15-grp-mini", { scale: 0.3, opacity: 0 }, { scale: 0.4, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 6.0 + 0.38 - 0.15);
      // "ক্যাপাসিটি।" 7.99 — the hero word slams in, top-center
      tl.fromTo("#f15-cap", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power4.out" }, 7.99);

      // ── Scene 3 · the overheating GPU rack ──
      // "Astra-র" 9.17 — rack exhibit rises in at the lower-left
      tl.fromTo("#f15-rack", { y: 150, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 9.17);
      // heat lines draw on, each starting at ~70% of the previous one's draw
      drawOn("#f15-heat-1", heat1Off, 9.48, 0.42);
      drawOn("#f15-heat-2", heat2Off, 9.78, 0.42);
      drawOn("#f15-heat-3", heat3Off, 10.08, 0.42);
      // "অভূতপূর্ব," 10.79 — yellow quote chip pops beside the rack
      pop("#f15-quote", 10.79, -10, -3);

      // ── Scene 4 · halve the allowance → reopen sign-ups ──
      // "অর্ধেক" 12.78 — pink lever chip pops center-right
      pop("#f15-allow", 12.78, 10, 3);
      // "দ্বিগুণ" 13.74 — "2× GPU" chip pops under the sign's spot
      pop("#f15-gpu", 13.74, 6, -2);
      // "না কিনেই" 14.70 — red marker strikes it through
      drawOn("#f15-strike-path", strikeOff, 14.7, 0.3);
      // "সাইন-আপ" 15.10 — the বন্ধ door sign swings in
      tl.fromTo("#f15-sign", { rotation: -12, y: -40, opacity: 0 }, { rotation: 0, y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 15.1);
      // "খোলা" 16.46 — the sign flips on its Y axis: বন্ধ → খোলা; hold
      tl.fromTo("#f15-sign-flip", { rotationY: 0 }, { rotationY: 180, duration: 0.42, ease: "power2.inOut" }, 16.46);

      window.__timelines = window.__timelines || {};
      window.__timelines["15-why"] = tl;
    })();
  </script>
