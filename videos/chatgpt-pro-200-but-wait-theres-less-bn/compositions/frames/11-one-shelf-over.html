  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      // ── number-wheel build (compositions/components/number-wheel.html), f11-scoped, double spin ──
      var CYCLES = 1;
      document.querySelectorAll("#f11-scene .f11-wheel").forEach(function (el) {
        if (el.dataset.f11WheelReady === "1") return;
        var value = el.dataset.value || "0";
        el.textContent = "";
        for (var c = 0; c < value.length; c++) {
          var ch = value.charAt(c);
          if (!/\d/.test(ch)) {
            el.appendChild(document.createTextNode(ch));
            continue;
          }
          var stops = CYCLES * 10 + Number(ch);
          var frame = document.createElement("span");
          frame.className = "f11-wheel-digit";
          var strip = document.createElement("span");
          strip.className = "f11-wheel-strip";
          // strip is (stops + 1) cells tall; land on its own digit by moving up `stops` cells
          strip.dataset.targetPct = String((-100 * stops) / (stops + 1));
          for (var i = 0; i <= stops; i++) {
            var cell = document.createElement("span");
            cell.textContent = String(i % 10);
            strip.appendChild(cell);
          }
          frame.appendChild(strip);
          el.appendChild(frame);
        }
        el.dataset.f11WheelReady = "1";
      });

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1: the camera tracks one shelf over ──
      // "এদিকে" 0.05 — the plank slides right → left across the lower frame
      tl.fromTo("#f11-plank", { x: 1960 }, { x: 0, duration: 1.3, ease: "power2.inOut" }, 0.05);
      // "তাকেই" 1.17 — the aisle sign swings in on its cords (long-tail settle, no overshoot)
      tl.fromTo("#f11-sign", { rotation: -32 }, { rotation: 0, duration: 0.95, ease: "power3.out" }, 1.17);
      tl.fromTo("#f11-sign", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.17);

      // ── Scene 2: split-tilt entry — mirrored book-open rotateY from opposite wings ──
      var TILT = 12;
      var TILT_OVER = 10;
      var SLIDE = 560;
      // "Claude" 2.07 — NEW PRO from the left wing, CLAUDE MAX from the right ~0.2s behind
      tl.fromTo(
        "#f11-box-pro",
        { x: -SLIDE, rotationY: TILT + TILT_OVER, scale: 0.85, opacity: 0 },
        { x: 0, rotationY: TILT, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
        2.07
      );
      tl.fromTo(
        "#f11-box-claude",
        { x: SLIDE, rotationY: -(TILT + TILT_OVER), scale: 0.85, opacity: 0 },
        { x: 0, rotationY: -TILT, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
        2.27
      );
      // box copy rises during the settle
      tl.fromTo("#f11-mult-pro", { opacity: 0, y: 16, rotation: -8 }, { opacity: 1, y: 0, rotation: -8, duration: 0.5, ease: "power3.out" }, 2.49);
      tl.fromTo("#f11-mult-claude", { opacity: 0, y: 16, rotation: 6 }, { opacity: 1, y: 0, rotation: 6, duration: 0.5, ease: "power3.out" }, 2.69);
      // contents gauges fill: HALF vs FULL
      tl.fromTo("#f11-fill-pro", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "power2.out" }, 2.87);
      tl.fromTo("#f11-fill-claude", { yPercent: 100 }, { yPercent: 0, duration: 0.85, ease: "power2.out" }, 3.07);
      // "দুইশো" 4.77 — identical $200/মাস tags drop out from under the plank
      tl.fromTo(["#f11-tagwrap-pro", "#f11-tagwrap-claude"], { y: -124 }, { y: 0, duration: 0.55, ease: "power3.out" }, 4.77);

      // ── Scene 3: the Claude side holds ──
      // "এখনও (বিশ)" 6.0 — inner-edge badge pops out of the Claude box's left edge
      tl.fromTo(
        "#f11-badge",
        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -4, duration: 0.5, ease: "expo.out" },
        6.0
      );
      // "দশ" 8.62 — scanner pass over the Claude tag, $10 / 1x rolls in (number-wheel)
      tl.fromTo("#f11-laser", { x: -12 }, { x: 476, duration: 0.42, ease: "power1.inOut" }, 8.62);
      tl.fromTo("#f11-unit-claude", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 8.65);
      document.querySelectorAll("#f11-unit-claude .f11-wheel-strip").forEach(function (strip, i) {
        tl.fromTo(
          strip,
          { yPercent: 0 },
          { yPercent: Number(strip.dataset.targetPct), duration: 0.85, ease: "power3.out" },
          8.65 + i * 0.07
        );
      });
      // ...while the ChatGPT tag shows $20 / 1x, dimmed to 70%
      tl.fromTo("#f11-unit-pro", { opacity: 0 }, { opacity: 0.7, duration: 0.4, ease: "power1.out" }, 8.62);

      // ── Scene 4: "বেস" 9.67 — the honest caveat ──
      tl.fromTo("#f11-foot", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.67);
      tl.fromTo("#f11-scene .f11-ast", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 9.72);

      // ── Scene 5: limits went up twice — then hold still ──
      // "দুইবার" 13.11
      tl.fromTo(
        "#f11-stk1",
        { scale: 0, opacity: 0, rotation: 20 },
        { scale: 1, opacity: 1, rotation: 8, duration: 0.45, ease: "expo.out" },
        13.11
      );
      // "বাড়িয়েছে।" 13.86
      tl.fromTo(
        "#f11-stk2",
        { scale: 0, opacity: 0, rotation: -18 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.45, ease: "expo.out" },
        13.86
      );

      window.__timelines["11-one-shelf-over"] = tl;
    })();
  </script>
