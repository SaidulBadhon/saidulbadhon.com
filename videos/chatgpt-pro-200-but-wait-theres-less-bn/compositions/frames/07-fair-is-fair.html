    (function () {
      var COMP_ID = "07-fair-is-fair";
      var DURATION = 18.455;
      var tl = gsap.timeline({ paused: true });

      // svg-path-draw: measured length; gap > length so round caps never leak a dot at t=0.
      function draw(id, at, dur, fallback) {
        var path = byId(id);
        var len = 0;
        try { len = path.getTotalLength(); } catch (e) { len = 0; }
        if (!len || !isFinite(len)) len = fallback;
        path.style.strokeDasharray = len + " " + (len + 24);
        tl.fromTo(
          path,
          { strokeDashoffset: len + 12 },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
          at
        );
      }

      // Handwritten note writes in left -> right (pen-speed clip wipe).
      function write(id, at, dur) {
        tl.fromTo(
          byId(id),
          { clipPath: "inset(-40% 106% -40% -6%)" },
          { clipPath: "inset(-40% -6% -40% -6%)", duration: dur, ease: "power1.inOut" },
          at
        );
      }

      // Receipt row slides up into the sheet.
      function rowIn(id, at) {
        tl.fromTo(
          byId(id),
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          at

      tl.fromTo(
        pill,
        { scale: 0.3, opacity: 0, rotation: -3 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.45, ease: "power3.out" },
        0.29
      );

      // Scene 2: row 1 on "পাঁচ"; check on "আসলেই"; সত্যি on "ভালো।"

      draw("f07-q", 13.6, 0.4, 200);
      draw("f07-q-dot", 14.02, 0.08, 10);
      write("f07-never", 14.49, 0.6);

      // Scene 5: on "ত্রিশে" the pink banner slams in (tilted -2deg) with a stamp thud.
      tl.fromTo(banner, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 15.65);
      tl.fromTo(
        banner,
        { scale: 1.3, rotation: -7 },
        { scale: 1, rotation: -2, duration: 0.32, ease: "power4.out" },
        15.65
      );
      tl.to(card, { y: 6, duration: 0.05, ease: "power2.out" }, 15.77);

      tl.to(ten, { x: 0, duration: 0.1, ease: "power2.out" }, 17.95);
